[project]
name = "market-scanner"
version = "0.1.0"
description = "ماسح متعدد الأسواق مبني على منهجية VDM"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
fast = ["pyarrow>=14.0"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
