# ═══════════════════════════════════════════════════════════════
#  قاعدة PostgreSQL على جهازك — للترحيل والتشغيل المحلّي
# ═══════════════════════════════════════════════════════════════
#
#   docker compose -f docker-compose.localdb.yml up -d
#   docker compose -f docker-compose.localdb.yml down      # يوقف
#   docker compose -f docker-compose.localdb.yml down -v   # ويحذف!
#
# ═══ لماذا ملفٌّ مستقلّ ═══
#
# ‏docker-compose.yml الكامل يطلب ``DJANGO_SECRET_KEY`` و
# ``POSTGRES_PASSWORD`` بصيغة ``${VAR:?}``. و‏compose يفسّر الملفّ
# **كلّه** قبل أن ينظر إلى الخدمة المطلوبة — فحتى
# ``up -d db`` وحدها تفشل إن لم تكن المتغيّرات كلّها مضبوطة.
#
# وهذا الملفّ لا يطلب شيئاً: يشغّل القاعدة وحدها بقيمٍ افتراضية
# صالحة للجهاز، فتبدأ الترحيل بأمرٍ واحد.
#
# ═══ وكلمة المرور هنا ليست سرّاً ═══
#
# ‏5433 مربوطٌ بـ 127.0.0.1 — لا يصله شيء من خارج جهازك. وكتابة
# كلمة مرورٍ معروفة هنا أوضح من إيهامٍ بسرٍّ في ملفٍّ مرفوع إلى
# GitHub. **ولا تستعمل هذا الملفّ على خادم.**

services:
  db:
    image: postgres:16-alpine
    container_name: scanner-localdb
    restart: unless-stopped
    environment:
      POSTGRES_DB: scanner
      POSTGRES_USER: scanner
      POSTGRES_PASSWORD: scanner_local_dev
      # ترتيبٌ غير UTF-8 يجعل فرز الأسماء العربية عشوائياً، ولا
      # يُغيَّر بعد الإنشاء إلّا بإعادة بناء القاعدة كلّها
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # ═══ 5433 لا 5432 ═══
      #
      # كي لا يصطدم بـ PostgreSQL مثبَّتٍ على الجهاز أصلاً. والاصطدام
      # يظهر بـ «port is already allocated» — واضحٌ لكنّه يوقفك،
      # أو الأسوأ: تتّصل بقاعدةٍ أخرى وأنت تظنّها هذه.
      - "127.0.0.1:5433:5432"
    volumes:
      - scanner_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanner -d scanner"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  # اسمٌ صريح: ``down -v`` يحذفه، والاسم يجعلك ترى ما تحذف
  scanner_pgdata:
