# Local PostgreSQL only -- for the SQLite -> Postgres migration
# and for running the app against Postgres on your machine.
#
#   docker compose -f docker-compose.localdb.yml up -d
#   docker compose -f docker-compose.localdb.yml down      # stop
#   docker compose -f docker-compose.localdb.yml down -v   # and erase
#
# Why a separate file: docker-compose.yml declares variables the
# full stack needs, and Compose resolves the whole file before it
# looks at the service you asked for. This one asks for nothing,
# so the database starts with a single command.
#
# Port 5433, not 5432, so it cannot collide with a PostgreSQL
# already installed on the machine -- and so you cannot connect to
# the wrong database while believing it is this one.
#
# The password below is not a secret: 5433 is bound to 127.0.0.1
# and nothing outside this machine can reach it. DO NOT USE THIS
# FILE ON A SERVER.
#
# Steps and troubleshooting: docs/POSTGRES.md

services:
  db:
    image: postgres:16-alpine
    container_name: scanner-localdb
    restart: unless-stopped
    environment:
      POSTGRES_DB: scanner
      POSTGRES_USER: scanner
      POSTGRES_PASSWORD: scanner_local_dev
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - scanner_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanner -d scanner"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  scanner_pgdata:
