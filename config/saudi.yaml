name: saudi

# ═══ مصدران لا مصدر واحد ═══
#
# ‏adapter          من يجلب الشموع
# ‏universe_adapter من يعرف مَن في السوق
#
# وفصلهما ليس تعقيداً بل ضرورة: ‎/companies/‎ عند سهمك **مجاني**
# ويعطي تاسي ونمو كاملين (نحو ثلاثمئة شركة)، بينما الشموع التاريخية
# عندها تحتاج باقة Starter فأعلى. وياهو يجلب شموع NNNN.SR مجاناً
# ولا يكتشف رمزاً واحداً.
#
# فبمصدر واحد كنت تختار بين نقصين: عشر شركات بشموع، أو ثلاثمئة بلا
# شموع. وبمصدرين تأخذ الاثنين مجاناً.
#
# إن رقّيت اشتراك سهمك إلى Starter فأعلى فاجعل adapter: sahmk
# وأزل universe_adapter — عندها مصدرٌ واحد يكفي وبياناته أدقّ.
adapter: yahoo
universe_adapter: sahmk
# الفريمات المتاحة في الواجهة: 15m · 1h · 4h · 1d · 1w
# هنا فريم المسح التلقائي فقط
timeframes: ["1d"]
candles: 1200
# auto = كل أسهم تاسي ونمو النشطة من /companies/ ، مرتّبة بحجم
#        التداول الريالي. الصكوك والصناديق مستبعَدة.
# list = قائمة symbols أدناه فقط
universe: auto

# ═══ الفريمات المتاحة من سهمك ═══
#
#     1d · 1w        باقة Starter فأعلى
#     1h  (= 60m)    باقة Pro فأعلى، وحتى 90 يوماً
#     4h             يُجمَّع من 60m — نفس حدّ Pro
#     15m            **غير متاح** — أصغر فريم لدى سهمك 30m
#
# فإن كانت باقتك Starter فأبقِ المسح على 1d.

# عتبة الحجم بالريال. الرقم مبدئي ويحتاج معايرة على السوق السعودي:
# سيولة تاسي أقلّ من الأسواق الأمريكية، والعتبة المنسوخة منها تُفرغ
# القائمة. صفرٌ يعني «لا عتبة» حتى تُقاس.
min_quote_volume: 0

# بلا سقف: تاسي + نمو نحو ثلاثمئة شركة، وهو عدد يُحتمل مسحه كاملاً.
# وضع سقفٍ هنا يعني اختيار مَن يُحلَّل قبل أن يُقاس أيّهم يستحقّ —
# والسقف بلا ترتيب بالحجم (وهو ما يقع على الباقة المجانية) اختيارٌ
# بترتيب أبجدي، أي عشوائيّ فعلياً.
top_n: null

# السوق السعودي: نهاية يوم فقط. التغطية تحتاج اختباراً رمزاً برمز قبل الاعتماد.
strong_threshold: 50
normal_threshold: 20
min_confluence: 2
require_htf: true
max_candidates: 10
# ثلاثة كانت مناسبةً لعشرة رموز، وصارت خانقةً لثلاثمئة: ياهو يجلب
# رمزاً واحداً في الطلب، فالعدد هنا هو سرعة السوق كلّه. وستّة تبقى
# دون حدّ ياهو المعتاد ولا تستدعي حظراً — والرفع فوق ذلك يشتري
# دقائق ويخاطر بمنعٍ يكلّف ساعة.
workers: 6

# ═══ لماذا فارغة ═══
#
# كانت عشرة رموز «احتياطية». وصارت ضرراً: كلّما تعثّر الاكتشاف
# الحيّ لحظةً واحدة سقط المسح إليها، فمُسح السوق على عشرة أسهم
# بينما ٣٢٦ شركة محفوظة في دليل القاعدة أمام عينيك.
#
# والكون الآن من دليل الشركات (زرّ «جلب الشركات ومعلوماتها»)، وهو
# أوثق: قائمةٌ جُلبت وحُفظت ورأيتها. والفراغ هنا يعني أنّ الفشل
# **يُعلَن** بدل أن يتنكّر في ثوب نجاحٍ بعشرة أسهم.
symbols: []
