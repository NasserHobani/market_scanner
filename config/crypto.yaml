name: crypto
adapter: binance
# الفريمات المتاحة في الواجهة: 15m · 1h · 4h · 1d · 1w
# هنا فريم المسح التلقائي فقط
timeframes: ["4h"]
candles: 1500   # فلتر الفريم الأعلى يحتاج تاريخاً؛ 500 لا تكفي

# auto = يجلب كل أزواج USDT من Binance ويرتّبها بحجم التداول
# list = يستخدم قائمة symbols أدناه فقط (للتحقق من المطابقة مع الشارت)
universe: auto
min_quote_volume: 200000       # 200 ألف دولار خلال 24 ساعة
# خُفضت من 20 مليون. الرقم مُعايَر على حالة حقيقية: EDENUSDT انفجرت
# 08-08 وحجمها **قبل** الانفجار كان ~220 ألفاً فقط (وصل 510 آلاف بعده).
# فعتبة 500 ألف كانت ستستبعدها في اللحظة التي نريدها فيها بالضبط —
# الحجم يرتفع مع الانفجار لا قبله، فمعايرة العتبة على الحجم اللاحق
# تعني اللحاق دائماً بعد فوات الأوان.
#
# المقابل صريح: مئات الأزواج ضعيفة السيولة تدخل المسح الآن. لذلك
# يُحفظ حجم كل رمز ويُصنَّف، وللوحة فلتر سيولة. إشارة على زوج حجمه
# 200 ألف ليست كإشارة على زوج بمئات الملايين — أمر واحد يحرّك الأول،
# والانزلاق عند التنفيذ قد يبتلع الربح المتوقّع كله.
top_n: null                    # مثال: 100 لأعلى مئة زوج فقط
workers: 12                    # طلبات متوازية للشبكة فقط
# الخيوط تجلب والتحليل يجري في الخيط الرئيسي: تشغيل التحليل داخل
# الخيوط كان يجعله أبطأ (×0.65 مقاسة) لأن pandas مقيّد بـ GIL.
# والجلب صار تراكمياً — بضع شموع لكل رمز — فوزن الطلب 1 أو 2 من
# أصل 6000 وحدة/دقيقة، ورفع الخيوط آمن.

strong_threshold: 60
normal_threshold: 25
max_candidates: 10

# تُستخدم فقط عند universe: list
symbols:
  - BTCUSDT
  - ETHUSDT
  - BNBUSDT
  - SOLUSDT
  - XRPUSDT
  - ADAUSDT
  - LINKUSDT
  - AVAXUSDT
  - DOTUSDT
  - LTCUSDT

weights:
  obv: 1.0
  vwap: 1.0
  cmf: 1.2
  mfi: 1.0
  ad: 1.0
  spike: 1.3
  obv_macd: 1.2
  rsi: 0.7
  trend: 0.8
  delta: 1.4

params:
  obv_ma_len: 20
  cmf_len: 20
  cmf_thresh: 0.05
  mfi_len: 14
  mfi_high: 60
  mfi_low: 40
  rvol_len: 20
  rvol_mult: 1.5
  rsi_len: 14
  rsi_high: 55
  rsi_low: 45
  ema_fast: 50
  ema_slow: 200
  atr_len: 14
  delta_thresh: 0.15

# تغذيات الأخبار — عناوين للقراءة فقط، لا تدخل في أي حساب
news_feeds:
  - https://www.coindesk.com/arc/outboundfeeds/rss/
  - https://cointelegraph.com/rss
