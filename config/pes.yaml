# ═══════════════════════════════════════════════════════════════
#  Pre-Explosion Strategy (PES) — كل حدٍّ ووزنٍ هنا قابل للتعديل
#
#  الهدف: اكتشاف بداية التمدّد قبل حدوثه، لا مطاردته بعد بدايته.
#  ولا شيء في هذا الملفّ مقدَّس: الأرقام نقطة بداية تُعدَّل بالقياس.
# ═══════════════════════════════════════════════════════════════

# ── الأوزان: مجموعها 100 ──
#
# ═══ عائلة الزخم لم تكبر ═══
#
# ‏MACD و StochRSI كلاهما مؤشّر زخم. ومقياسان لشيءٍ واحد ليسا
# شاهدين مستقلّين بل شاهداً واحداً بصوتين — وإعطاؤهما وزنين
# منفصلين يجعل الزخم يُحسب مرّتين.
#
# فوزن الالتقاء مأخوذ من ميزانية العائلة نفسها:
#
#     قبل:  rsi 5 + macd 5 + divergence 5         = 15
#     بعد:  momentum_confluence 10 + rsi 3
#           + divergence 2                        = 15
#
# ‏macd لم يعد عاملاً مستقلّاً: منطقه كلّه داخل الالتقاء وأدقّ.
weights:
  btc_regime: 10
  daily_trend: 10
  h4_trend: 10
  compression: 15
  volume: 15
  obv: 10
  resistance: 10
  adx: 5
  momentum_confluence: 10
  rsi: 3
  divergence: 2

# ── مرشّح السيولة ──
liquidity:
  min_market_cap: 50000000      # ‏$50M
  min_volume_24h: 5000000       # ‏$5M
  min_volume_to_mcap: 0.05      # ‏5٪
  # يُطبَّق حين تتوفّر البيانات فقط؛ وغيابها يُعلَن ولا يُخمَّن
  skip_when_unknown: true

# ── مانع المطاردة ──
anti_chasing:
  max_change_24h: 20.0          # ٪ — فوقها ALREADY_EXPANDED
  max_change_4h: 15.0
  # ابتعاد السعر عن EMA20 اليومي: ارتفاعٌ حدث بالفعل
  max_ext_above_ema20: 12.0     # ٪

# ── انضغاط التقلّب (بولنجر) ──
compression:
  lookback: 100
  bands_length: 20
  # النسبة المئوية → النقاط
  tiers: [[10, 15], [20, 12], [30, 9], [40, 5]]

# ── تراكم الحجم ──
volume:
  sma_length: 20
  tiers: [[1.0, 0], [1.3, 3], [1.5, 7], [2.0, 11], [999, 15]]
  # ‏RVOL مرتفع + سعرٌ انفجر = ليست ما قبل الانفجار
  explosive_rvol: 3.0

# ── تراكم OBV ──
obv:
  window: 20
  # السعر ثابت والـOBV يصعد = تجميع
  max_price_range_pct: 8.0

# ── قرب المقاومة ──
resistance:
  lookback: 60
  pivot_left: 5
  pivot_right: 5
  tiers: [[1.0, 10], [3.0, 9], [5.0, 6], [7.0, 3]]

# ── ADX ──
adx:
  length: 14
  min_value: 15
  # ‏ADX مرتفعٌ جداً = الحركة بدأت
  max_value: 40

# ── RSI ──
rsi:
  length: 14
  ideal_low: 50
  ideal_high: 65
  overbought: 75

# ═══════════════ التقاء الزخم: MACD + StochRSI ═══════════════
#
#     MACD     = هل بدأت الطاقة تتغيّر؟   (تأكيد التحوّل)
#     StochRSI = ومتى تبدأ الحركة؟        (التوقيت)
#
# ولا شيء هنا مزروعٌ في الكود — كلّه يُقرأ من هذا الملفّ.
momentum:
  macd:
    fast: 12
    slow: 26
    signal: 9
    slope_bars: 5
    # كم شمعة متتالية صاعدة تُسمّى «مدرَّجاً صاعداً»
    rising_bars: 3
    # الميل نسبةً إلى مدى المدرَّج — لا رقمٌ مطلق. فالمدرَّج بوحدة
    # السعر، وعتبةٌ ثابتة تصلح لبتكوين وتخطئ في رمزٍ بريال.
    strong_slope: 0.10

  stoch_rsi:
    rsi_length: 14
    stoch_length: 14
    k: 3
    d: 3
    low_zone: 30
    high_zone: 80
    # «قادمٌ من منطقةٍ منخفضة» يُقاس على هذه النافذة
    from_low_bars: 8
    # تشبّعٌ شرائي مزمن يُبطل التوقيت: مؤشّرٌ بقي فوق high_zone
    # ستّ شمعات ليس بداية دورة، والتقاطع داخله تذبذبٌ في القمّة
    max_overbought_bars: 6
    late_level: 90

  # المطاردة: زخمٌ قويّ + StochRSI مرتفع + ارتفاعٌ تحقّق
  late:
    min_gain_pct: 15.0
    lookback_bars: 30

# ═══════════ امتداد فيبوناتشي المبني على الاتجاه ═══════════
#
#     P1 = قاع بداية الموجة
#     P2 = قمّة الموجة
#     P3 = قاع التصحيح
#     المستوى = P3 + (P2 − P1) × النسبة
#
# وهي أداة **أهداف** لا إشارات — كما ينصّ مصدرها. فلا تُضيف نقاطاً
# إلى التقييم، وتدخل من بابين فقط: هدفٌ يُعرض، ورفضٌ حين يتجاوز
# السعر ‎1.618‎ (فالحركة جرت).
#
# وأكبر عيوبها في الرسم اليدوي ذاتيّةُ اختيار النقاط. وهنا تُختار
# بقاعدةٍ واحدة: آخر ثلاثة محاور مؤكَّدة من الزيجزاج نفسه الذي
# يبني بقيّة التحليل. فالنتيجة تتكرّر وتُقاس.
#
# وقياسٌ على ١٦٠ رمزاً: ٣٨٪ منها لها موجة صالحة. والباقي يُرفض
# بسببٍ مكتوب — أغلبه «التصحيح كسر بداية الموجة».
fib_extension:
  pivot_length: 10
  min_swing_atr: 1.0
  atr_len: 14

  # تصحيحٌ أقلّ من ‎23.6٪‎ توقّفٌ لا تصحيح، وأعمق من ‎88.6٪‎ يعني
  # أنّ الموجة أُلغيت — وامتدادُ موجةٍ ملغاة بلا معنى
  min_retracement: 0.236
  max_retracement: 0.886

  # حجم الموجة بمضاعف ATR لا بنسبةٍ ثابتة: رمزٌ يتحرّك ‎1٪‎ يومياً
  # ورمزٌ يتحرّك ‎15٪‎ لا يُقاسان بمسطرةٍ واحدة
  min_leg_atr: 2.0

  # تقاربٌ دون هذا بين مستوى فيب والمقاومة يُسمّى التقاءً
  confluence_pct: 1.0

  # فوق هذه النسبة: الحركة جرت
  extended_ratio: 1.618
  # اجعلها false لتعطيل الرفض والاكتفاء بالعرض
  anti_chasing: true

# ── التصنيف ──
classification:
  watch_min: 65
  pre_breakout_min: 75
  pre_breakout_max_distance: 3.0
  # الاختراق بجسم شمعة لا بفتيل
  breakout_min_rvol: 1.8
  breakout_min_body_ratio: 0.5
  retest_max_distance: 2.0

  # ── إنذارٌ مبكّر: زخمٌ تحوّل ولمّا يقترب الاختراق ──
  # وهذه **ليست** دخولاً — هي «راقب» بسببٍ مسمّى.
  early_momentum_min: 65
  early_momentum_confluence: 7

  # ── أقوى ما قبل الاختراق ──
  strong_pre_breakout_min: 75
  strong_pre_breakout_confluence: 7
  strong_pre_breakout_max_distance: 3.0
  strong_pre_breakout_min_rvol: 1.3

# ── قاعدة العائلات (رقم ١٧) ──
#
# النقاط من عائلاتٍ مختلفة لا من مؤشّرات تقيس الشيء نفسه.
# ‏EMA و Supertrend و ADX ثلاثتها «اتجاه» — واجتماعها ليس ثلاث
# إشارات بل إشارةٌ واحدة بثلاثة أسماء.
families:
  min_for_pre_breakout: 3
  # حصّة العائلة من سقفها كي تُعدّ «مساهِمة»
  contribution_ratio: 0.4
