# تقويم الأحداث الكلّية المؤثّرة في البيتكوين
#
# ═══ لماذا ملفٌّ لا كاشط ═══
#
# مواعيد الفِد و CPI تُنشَر قبل سنةٍ كاملة ولا تتغيّر. وكاشطُ
# موقعٍ لها يضيف اعتماداً على شبكةٍ وصيغةِ صفحةٍ قد تتغيّر، مقابل
# لا شيء: البيانات ثابتة.
#
# وثمن الملفّ أن يُحدَّث سنوياً. ولهذا يُحذّر النظام صراحةً حين
# ينفد التقويم — تقويمٌ فارغٌ صامت أسوأ من غيابه.
#
# ═══ المصادر ═══
#
#   FOMC  https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
#   CPI   https://www.bls.gov/schedule/news_release/cpi.htm
#
# ═══ ناقص ═══
#
# المُدخَل هنا ما تُحقّق منه فقط. وما بقي من ٢٠٢٦ ومواعيد ٢٠٢٧
# تُنسَخ من الرابطين أعلاه. ولا تُخمَّن: موعدٌ خاطئ أسوأ من
# موعدٍ غائب، لأنّه يُقرأ كأنّه صحيح.

