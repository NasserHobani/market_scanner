name: gold

# ═══════════════════════════════════════════════════════════════
#  الذهب — من رموز بينانس المغطّاة بالسبائك
# ═══════════════════════════════════════════════════════════════
#
# ═══ لماذا ليس XAUUSD ═══
#
# ‏XAUUSD سعرُ فوركس لا سوقٌ مركزيّ: كل وسيطٍ يعرض سعره وفرقه،
# ولا حجم تداولٍ حقيقيّ فيه. ومؤشّرات هذا النظام نصفُها حجم —
# ‏OBV وCMF وMFI وRVOL ورصد الاختراق — فتصمت كلّها أو تكذب.
#
# و‏XAUUSDT لا وجود له في بينانس أصلاً.
#
# ═══ والبديل: رمزان مغطّيان بالذهب ═══
#
#     PAXGUSDT   باكسوس جولد — أونصة في خزائن لندن، وأعمقهما سيولة
#     XAUTUSDT   تيذر جولد — الفكرة نفسها، ومصدرٌ ثانٍ للمقارنة
#
# كلاهما يتبع سعر الأونصة، ويُتداولان ٢٤/٧ بحجمٍ **حقيقيّ** على
# دفتر أوامرٍ واحد. فالمؤشّرات تعمل كما تعمل على أيّ زوج.
#
# والفارق عن الفوري: علاوةٌ أو خصمٌ صغير يتحرّك مع الطلب على
# الترميز نفسه. فالاتجاه واحد، والسعر ليس مطابقاً تماماً.
adapter: binance

# ═══ الفريم اليوميّ للمسح ═══
#
# الذهب يتحرّك بأخبار الفائدة والتضخّم — أحداثٌ يومية لا لحظية.
# والمسح على 4h يُنتج إشارات على ضجيجٍ داخل اليوم.
# والواجهة تبقى تعرض كل الفريمات.
timeframes: ["4h"]
candles: 1500

# ═══ قائمة لا اكتشاف ═══
#
# ``auto`` يجلب كل أزواج USDT ويرتّبها بالحجم — وهو ما يفعله سوق
# الكريبتو. وهنا المطلوب رمزان بعينهما، فالاكتشاف يُفرغ المعنى.
universe: list
min_quote_volume: 0
top_n: null
workers: 4

symbols:
  - PAXGUSDT
  - XAUTUSDT

# عتبات المسح: أعلى من الكريبتو عمداً.
# الذهب أهدأ بكثير، فعتبةٌ منخفضة تُنتج إشارةً كل يوم — وإشارةٌ
# تأتي كل يوم ليست إشارة.
strong_threshold: 65
normal_threshold: 35
max_candidates: 5

weights:
  obv: 1.0
  vwap: 1.0
  cmf: 1.2
  mfi: 1.0
  ad: 1.0
  spike: 1.3
  obv_macd: 1.2
  rsi: 0.7
  trend: 0.8
  delta: 1.4

params:
  obv_ma_len: 20
  cmf_len: 20
  cmf_thresh: 0.05
  mfi_len: 14
  mfi_high: 60
  mfi_low: 40
  rvol_len: 20
  # ═══ ١٫٢ لا ١٫٥ ═══
  #
  # ‏RVOL في سوقٍ هادئ نادراً ما يبلغ ضعفاً ونصفاً. والعتبة
  # المنسوخة من الكريبتو تجعل عامل الحجم صفراً دائماً — فيبدو
  # مقيساً وهو معطَّل.
  rvol_mult: 1.2
  rsi_len: 14
  rsi_high: 55
  rsi_low: 45
  ema_fast: 50
  ema_slow: 200
  atr_len: 14
  delta_thresh: 0.15
