name: us
adapter: alpaca         # كان yahoo — انظر أسفل الملف
# الفريمات المتاحة في الواجهة: 15m · 1h · 4h · 1d · 1w
#
# ═══ وهنا ما يُمسح تلقائياً — والقائمة تُقرأ كلّها ═══
#
# كانت ‎["1d"]‎ وحدها، وكان المسح يقرأ أوّل عنصرٍ فقط. فبقي فريم
# ‎4h‎ بلا **ولا جولة مسحٍ واحدة** منذ إنشاء النظام: شموعه تُزامَن
# كل عشر دقائق وتُخزَّن كاملة (٣٢٣ رمزاً، آخرها اليوم)، والشاشة
# تعرضه في قائمة الفريمات — ثمّ لا نتيجة، بلا خطأ ولا سبب.
#
# ⚠ والثمن وقت: كل فريمٍ هنا دورةُ مسحٍ كاملة. ومسح ‎us‎ يستغرق
#   نحو اثنتي عشرة دقيقة للفريم الواحد، فالفريمان ‎24‎ دقيقة —
#   وفترة المهمّة خمس عشرة دقيقة. فارفع فترة ‎scan:us‎ إلى ساعة
#   من صفحة ‎/jobs/‎، أو افصل ‎4h‎ في مهمّةٍ مستقلّة بحمولة
#   ‎{"market": "us", "timeframe": "4h"}‎ وفترةٍ أطول.
timeframes: ["1d", "4h"]
candles: 1200

# auto = كل الأسهم القابلة للتداول في NYSE/NASDAQ/ARCA/AMEX/BATS،
#        مرتّبة بمتوسط حجم التداول الدولاري لعشرين يوماً
# list = قائمة symbols أدناه فقط
universe: auto

# عشرون مليون دولار يومياً. الرقم أعلى بكثير من عتبة الكريبتو
# (200 ألف) وذلك مقصود: سهم أمريكي بحجم مئتي ألف دولار يومياً ورقة
# مهملة، فارق السعر فيها واسع والانزلاق يبتلع الخطة. وهي أيضاً حدّ
# عملي: أربعة آلاف سهم قابل للتداول، والعتبة تُبقي ~700 منها.
min_quote_volume: 20000000
top_n: 400              # سقف صريح فوق العتبة — المسح يبقى دقائق لا ساعة

# عتبات هذا السوق وحده — لا تُنسخ من العملات
# الأسهم أقل تذبذباً، فالعتبة أخفض والالتقاء المطلوب أعلى
strong_threshold: 50
normal_threshold: 20
min_confluence: 2
require_htf: true
max_candidates: 10
# الجلب مجمَّع (مئة رمز في الطلب) فالتوازي لم يعد هو ما يحدّد الزمن.
# والخطة الأساسية تسمح بمئتي طلب في الدقيقة — رفع الخيوط يستهلكها بلا
# فائدة ويستدعي 429.
workers: 4

# تُستخدم فقط عند universe: list
symbols:
  - AAPL
  - MSFT
  - NVDA
  - GOOGL
  - AMZN
  - META
  - AVGO
  - TSLA
  - JPM
  - XOM

weights: {obv: 1.0, vwap: 0.6, cmf: 1.2, mfi: 1.0, ad: 1.0, spike: 1.3,
          obv_macd: 1.2, rsi: 0.7, trend: 1.0, delta: 0.8, fib: 1.0, div: 1.3}

params:
  ema_fast: 50
  ema_slow: 200
  atr_len: 14
  zigzag_len: 8
  min_swing_atr: 1.0

# تغذيات الأخبار — عناوين للقراءة فقط، لا تدخل في أي حساب
news_feeds:
  - https://feeds.a.dj.com/rss/RSSMarketsMain.xml
  - https://www.cnbc.com/id/100003114/device/rss/rss.html

# ═══════════════════════════════════════════════════════════════
#  لماذا Alpaca بدل Yahoo
#
#  ١) اكتشاف الرموز. محوّل Yahoo كان يرفع NotImplementedError، فالسوق
#     الأمريكي محبوس في عشرة رموز مكتوبة يدوياً بينما الكريبتو يمسح
#     المئات. Alpaca يعطي قائمة الأصول كاملة.
#  ٢) طلب واحد لمئة رمز بدل طلب لكل رمز.
#  ٣) واجهة موثّقة ومصادَق عليها، لا واجهة غير رسمية تتغيّر بلا إشعار.
#
#  المفاتيح في ملف .env (لا تُرفع إلى git):
#     ALPACA_API_KEY_ID=...
#     ALPACA_API_SECRET_KEY=...
#     ALPACA_PAPER=1            ← للحساب الورقي (المفتاح يبدأ بـ PK)
#  تُنشأ من لوحة Alpaca ← API Keys. مفاتيح القراءة تكفي — هذا الربط
#  بيانات فقط ولا يرسل أوامر.
#
#  الحساب الورقي والحقيقي **مضيفان منفصلان**، ومفتاح أحدهما يُرفض على
#  الآخر بـ 401. والمحوّل يستدلّ بالبادئة (‏PK ورقي · AK حقيقي) ويجرّب
#  المضيف المقابل تلقائياً عند الرفض، فـ ALPACA_PAPER احتياط لا شرط.
#  ملاحظة تفسّر حيرة أول تشغيل: بيانات السوق مضيفها **واحد** للحسابين،
#  فالشموع تصل بينما قائمة الأصول وحدها تفشل.
#
#  ⚠ التغذية: بلا اشتراك Algo Trader Plus تصل بيانات IEX وحدها، وهي
#  ~2.5٪ من حجم السوق. ومحرّك هذا المشروع مبنيّ على الحجم، فالعيّنة
#  الجزئية تجعل RVOL ورصد الاختراق يقرآن توجيه الأوامر لا نشاط السوق.
#  المحوّل يكتشف التغذية ويعرض تحذيراً في اللوحة. للعودة إلى Yahoo:
#  بدّل adapter إلى yahoo و universe إلى list.
# ═══════════════════════════════════════════════════════════════

# ═══ توقيت السوق ═══
# مهلة بثّ الاشتراك بالدقائق. الاشتراك المجاني يتأخّر خمس عشرة
# دقيقة، ولا يُعدّ ذلك تأخّراً في النظام. صفّرها إن رقّيت إلى بثّ
# لحظي، وإلا حُسبت لك نضارةٌ أقسى مما يستطيع مزوّدك أصلاً.
feed_delay_minutes: 15

# أيّام الإغلاق الرسمية (YYYY-MM-DD). بدونها تُحسَب الإجازة جلسةً
# مفتوحة — انزياح يوم واحد لا أكثر.
holidays: []
