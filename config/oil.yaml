name: oil

# ═══════════════════════════════════════════════════════════════
#  النفط — عقود ياهو، لأنّ بينانس لا نفط فيها
# ═══════════════════════════════════════════════════════════════
#
# اختيار «رموز الذهب في بينانس» لا يمتدّ إلى النفط: لا زوج نفطٍ
# واحد هناك. فمصدر النفط ياهو — ومحوّلُه يعمل عندك أصلاً، ويشتقّ
# ‎4h‎ من الساعيّ كما فعل للسوق السعودي.
#
#     CL=F   خام غرب تكساس (نايمكس) — المرجع الأمريكي
#     BZ=F   برنت (‏ICE) — المرجع العالمي، وعليه تُسعَّر الخليج
#
# والاثنان معاً لا أحدهما: الفارق بينهما (‏Brent–WTI spread) خبرٌ
# بذاته عن الطلب والشحن، ويُقرأ بوضعهما جنباً إلى جنب.
adapter: yahoo

timeframes: ["4h"]
candles: 1500

universe: list
min_quote_volume: 0
top_n: null
workers: 4

symbols:
  - CL=F
  - BZ=F

# ═══ الحجم في العقود المستمرّة ═══
#
# ياهو يعطي حجم **العقد الأقرب**، وهو يقفز عند تدوير العقود:
# ينهار حجم المنتهي ويظهر حجم التالي. فقفزة الحجم قد تكون تدويراً
# لا طلباً — وعامل الحجم هنا يُقرأ بحذرٍ أكبر من الأسهم.
#
# والعتبات أعلى لهذا السبب ولأنّ النفط أهدأ من الكريبتو.
strong_threshold: 65
normal_threshold: 35
max_candidates: 5

weights:
  obv: 1.0
  vwap: 1.0
  cmf: 1.2
  mfi: 1.0
  ad: 1.0
  spike: 1.3
  obv_macd: 1.2
  rsi: 0.7
  trend: 0.8
  delta: 1.4

params:
  obv_ma_len: 20
  cmf_len: 20
  cmf_thresh: 0.05
  mfi_len: 14
  mfi_high: 60
  mfi_low: 40
  rvol_len: 20
  rvol_mult: 1.2
  rsi_len: 14
  rsi_high: 55
  rsi_low: 45
  ema_fast: 50
  ema_slow: 200
  atr_len: 14
  delta_thresh: 0.15
