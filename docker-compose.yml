# market-scanner -- three services: db, web, scheduler.
#
# Local:     docker compose up -d --build
# Portainer: Stacks > Add stack > Repository
#
# All reasoning, trade-offs and troubleshooting live in
# docs/PORTAINER.md. This file is kept plain ASCII on purpose:
# it is parsed by Docker's Go YAML parser, which I cannot test
# against from here -- so it carries no bidirectional text and
# no comments inside block sequences.
#
# Variables come from .env locally, or from the stack's
# Environment variables in Portainer. See .env.docker.example.

services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scanner}
      POSTGRES_USER: ${POSTGRES_USER:-scanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scanner} -d ${POSTGRES_DB:-scanner}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  web:
    build: .
    image: market-scanner:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_started
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      POSTGRES_DB: ${POSTGRES_DB:-scanner}
      POSTGRES_USER: ${POSTGRES_USER:-scanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      SCANNER_TIMEZONE: ${SCANNER_TIMEZONE:-Asia/Riyadh}
      AUTO_SCAN_MARKETS: ${AUTO_SCAN_MARKETS:-crypto,us,saudi}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      ALPACA_API_KEY: ${ALPACA_API_KEY:-}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:-}
      SAHMK_API_KEY: ${SAHMK_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SCHEDULER_ENGINE: "off"
      AUTO_SCAN: "0"
      DJANGO_DEBUG: "0"
      RUN_MIGRATIONS: "1"
      COLLECT_STATIC: "1"
      SEED_JOBS: ${SEED_JOBS:-1}
    ports:
<<<<<<< Updated upstream
      # ═══ الربط مغلقٌ افتراضاً — اقرأ قبل تغييره ═══
      #
      # لا تسجيل دخول في هذا النظام. ولا صفحة واحدة تسأل عن هويّة.
      # فمن يعرف العنوان يقرأ صفقاتك، ويغيّر حدود المخاطرة، ويشغّل
      # المسح — أي يستهلك مفاتيحك عند Alpaca و Claude.
      #
      # و‏WEB_BIND افتراضه ‎127.0.0.1‎: الخدمة تعمل ولا تُرى من
      # خارج الخادم. وفتحُها يحتاج كتابةً صريحة — لأنّ القرار
      # يجب أن يكون واعياً لا نتيجةَ نسخ أمرٍ من دليل.
      #
      # للوصول من جهازك:  ssh -L 8000:127.0.0.1:8000 user@server
      # أو ضع وكيلاً عكسياً بكلمة مرور. انظر docs/PORTAINER.md.
      - "${WEB_PORT:-8000}"
    volumes:
      - appdata:/app/data
      - reports:/app/reports
    logging: &logs
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  scheduler:
    image: market-scanner:latest
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
      db:
        condition: service_started
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      POSTGRES_DB: ${POSTGRES_DB:-scanner}
      POSTGRES_USER: ${POSTGRES_USER:-scanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      SCANNER_TIMEZONE: ${SCANNER_TIMEZONE:-Asia/Riyadh}
      AUTO_SCAN_MARKETS: ${AUTO_SCAN_MARKETS:-crypto,us,saudi}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      ALPACA_API_KEY: ${ALPACA_API_KEY:-}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:-}
      SAHMK_API_KEY: ${SAHMK_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SCHEDULER_ENGINE: "off"
      AUTO_SCAN: "0"
      DJANGO_DEBUG: "0"
      RUN_MIGRATIONS: "0"
      COLLECT_STATIC: "0"
      SEED_JOBS: "0"
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-60}
    command: ["/app/docker-scheduler.sh"]
    scale: 1
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/scheduler-heartbeat -mmin -30 | grep -q ."]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 300s
    volumes:
      - appdata:/app/data
      - reports:/app/reports
    logging: *logs

volumes:
  pgdata:
  appdata:
  reports:
